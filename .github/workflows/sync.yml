name: Sync Trakt Calendar

on:
  # schedule:
  #   # Runs every 8 hours (05:00 UTC = 12:00 AM CDT, 13:00 UTC = 08:00 AM CDT, 21:00 UTC = 04:00 PM CDT)
  #   - cron: '0 5,13,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: trakt-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Trakt Calendar & Generate iCal
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12.3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Restore / Save Trakt Show Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .show_cache.json
          key: trakt-show-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trakt-show-cache-${{ runner.os }}-
            trakt-show-cache-

      - name: Install Dependencies
        run: |
          uv sync --locked --no-build --no-dev

      - name: Setup Google Service Account (if provided)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > service_account.json
          chmod 600 service_account.json

      - name: Generate iCal Calendars & Sync
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          SYNC_GOOGLE: ${{ secrets.SYNC_GOOGLE || 'false' }}
          GOOGLE_SHARE_EMAIL: ${{ secrets.GOOGLE_SHARE_EMAIL }}
        run: |
          uv run --locked --no-build generate_ical.py

      - name: Update Trakt Secrets in GitHub (if refreshed)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -f ".trakt_refreshed_tokens.json" ]; then
            if [ -n "$GH_TOKEN" ]; then
              echo "Detected refreshed Trakt tokens. Updating GitHub repository secrets..."
              ACCESS_TOKEN=$(jq -r '.access_token' .trakt_refreshed_tokens.json)
              REFRESH_TOKEN=$(jq -r '.refresh_token' .trakt_refreshed_tokens.json)
              if [ -n "$ACCESS_TOKEN" ] && [ "$ACCESS_TOKEN" != "null" ]; then
                gh secret set TRAKT_ACCESS_TOKEN --body "$ACCESS_TOKEN" --repo "${{ github.repository }}"
                echo "Successfully updated TRAKT_ACCESS_TOKEN secret."
              fi
              if [ -n "$REFRESH_TOKEN" ] && [ "$REFRESH_TOKEN" != "null" ]; then
                gh secret set TRAKT_REFRESH_TOKEN --body "$REFRESH_TOKEN" --repo "${{ github.repository }}"
                echo "Successfully updated TRAKT_REFRESH_TOKEN secret."
              fi
            else
              echo "::warning::Trakt tokens were refreshed, but GH_SECRETS_PAT secret is not set. Cannot update GitHub Secrets automatically."
            fi
            rm -f .trakt_refreshed_tokens.json
          fi

      - name: Clean sensitive temporary files
        if: always()
        run: |
          rm -f service_account.json .trakt_refreshed_tokens.json

      - name: Generate Job Summary
        if: always()
        env:
          SYNC_GOOGLE: ${{ secrets.SYNC_GOOGLE || 'false' }}
        run: |
          echo "## 📅 Trakt Calendar Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sync Outcome** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Google Sync Enabled** | \`$SYNC_GOOGLE\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls ./*.ics 1> /dev/null 2>&1; then
            echo "✅ iCal file(s) generated successfully:" >> $GITHUB_STEP_SUMMARY
            ls -lh ./*.ics | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload iCal Files as Artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ical-files
          path: '*.ics'
          retention-days: 7
